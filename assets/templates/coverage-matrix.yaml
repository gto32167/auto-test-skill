coverage_profile:
  mode: "full"
  core_form_fields_present: true
  required_granularities: ["scenario", "field"]
  priority_policy: "risk_first_configurable"

test_points:
  - test_point_id: "TP-001"
    obligation_id: "OB-001"
    verification_target: "合法数据提交后商品保存成功"
    requirement_ids: ["REQ-001"]
    module: "商品创建"
    feature_group: "供应商端-商品创建页"
    title: "合法数据创建商品"
    granularity: "scenario"
    polarity: "positive"
    interface: "ui"
    expected_outcome: "committed"
    coverage_class: "main_flow"
    priority: "P0"
    priority_rationale: "商品创建是核心业务主流程，失败会阻断商品销售。"
    level: "L2"
    coverage_unit_signature: "RULE-001|positive|valid|main_flow|accepted"

  - test_point_id: "TP-002"
    obligation_id: "OB-002"
    verification_target: "商品名称保存后回显合法值"
    requirement_ids: ["REQ-001"]
    module: "商品创建"
    feature_group: "供应商端-商品创建页"
    title: "商品名称合法值"
    granularity: "field"
    polarity: "positive"
    interface: "ui"
    expected_outcome: "accepted"
    field_id: "goods.name"
    coverage_class: "valid"
    priority: "P2"
    priority_rationale: "合法字段输入属于低风险基础校验，失败影响局部录入且可立即恢复。"
    level: "L3"
    coverage_unit_signature: "RULE-001|positive|valid|valid|accepted"

  - test_point_id: "TP-003"
    obligation_id: "OB-003"
    verification_target: "商品名称为空时显示必填提示"
    requirement_ids: ["REQ-001"]
    module: "商品创建"
    feature_group: "供应商端-商品创建页"
    title: "商品名称空值"
    granularity: "field"
    polarity: "negative"
    interface: "ui"
    expected_outcome: "rejected"
    field_id: "goods.name"
    coverage_class: "empty"
    priority: "P1"
    priority_rationale: "必填拦截是主要业务校验，失效会产生不完整商品数据但影响范围可控。"
    level: "L3"
    coverage_unit_signature: "RULE-001|negative|invalid|empty|rejected"

field_coverage:
  - field_id: "goods.name"
    required_classes: ["valid", "empty"]

# 与 05_requirements.yaml.atomic_rules.coverage_characteristics 计算出的 U_i
# 一一对应。不要用一条场景用例声明多个 signature。
coverage_unit_signature_examples:
  - "RULE-001|positive|valid|valid|accepted"
  - "RULE-001|negative|invalid|empty|rejected"

uncovered_risks:
  - risk_id: "RISK-001"
    description: ""
    reason: ""

assumptions:
  - assumption_id: "ASM-001"
    description: ""
