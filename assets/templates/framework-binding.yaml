framework_binding:
  framework_mode: "builtin_readonly_mirror"
  framework_root: "<framework-root>\\builtin_framework"
  runtime_workspace: "{project_dir}\\runtime\\external_framework_runtime"
  auth_storage_state_path: "{project_dir}\\14_backend_storage_state.json"
  priority_execution_policy:
    version: "1.1"
    order: ["P0", "P1", "P2"]
    complete_p0_before_lower_priorities: true
    stop_when_all_p0_failed: true
    blocked_triggers_stop: false
    unstarted_status: "not_run"
    not_run_reason_code: "p0_all_failed_stop_gate"
  selected_cases:
    - case_id: "TC-001"
      priority: "P0"
      external_test: "tests/test_example.py::TestExample::test_example"
      raw_script: "record_raw/example.py"
      reuse_existing_script: true
  # Fill project-specific values in a local copy; never commit credentials.
  runtime_config:
    browser: "chromium"
    headless: false
    slow_mo: 0
    timeout: 30000
    base_url: "<business-origin>"
    env:
      username: "<test-username>"
      password: "<test-password>"
    runtime:
      test_url_input: "<business-entry-url>"
      dashboard_url: "<dashboard-url>"
      goods_list_url: "<list-url>"
      login_url: "<login-url>"
      auth_storage_state_path: "{project_dir}\\14_backend_storage_state.json"
      backend_username: "<test-username>"
      backend_password: "<test-password>"
      business_origin: "<business-origin>"
      passport_origin: "<passport-origin>"
      store_id: "<store-id>"
  outputs:
    execution_log: "{project_dir}\\runtime\\external_framework_runtime\\framework_run.log"
    allure_results: "{project_dir}\\runtime\\external_framework_runtime\\allure-results"
    allure_report: "{project_dir}\\runtime\\external_framework_runtime\\allure-report"
  # ===== 可选执行项：由可用输入决定是否执行，缺输入则跳过不中断 =====
  optional_execution_items:
    code_review:                 # 代码走查：需代码路径或 git 仓库地址
      enabled: false             # true 或 false；true 但无输入 → 跳过并记录原因
      code_path: ""              # 如 "E:\\repo\\project"（本地路径）
      git_url: ""                # 如 "https://github.com/org/repo.git"（仓库地址）
      git_branch: ""             # 分支，默认 main/master
      focus_modules: []          # 可选：重点走查模块，如 ["商品创建", "退款"]
      output: "{project_dir}\\code_review_report.md"
    api_testing:                 # 接口测试：需接口文档或 API 域名
      enabled: false
      api_doc_path: ""           # OpenAPI/Swagger JSON/YAML 或自建接口清单
      api_doc_url: ""            # 在线 Swagger/OpenAPI 链接
      api_base_url: ""           # 如 "https://api.example.test"
      api_req_host: ""           # 可选：Req-Host 头（多租户场景）
      auth: ""                   # 鉴权方式：token/cookie/sign
      output: "{project_dir}\\api_testing_report.md"
